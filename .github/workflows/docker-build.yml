
name: Docker Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t ci-cd-demo:test .

      - name: Run Docker container
        run: docker run -d --name ci-cd-test -p 8083:80 ci-cd-demo:test

      - name: Show running containers
        run: docker ps -a

      - name: Test application
        run: |
          curl --fail --silent --show-error \
            --retry 10 \
            --retry-connrefused \
            --retry-delay 2 \
            --output response.html \
            http://127.0.0.1:8083/
  - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag ci-cd-demo:test ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}:latest

          cat response.html
          grep -F "My First CI/CD Deployment!" response.html

      - name: Show logs if something fails
        if: failure()
        run: docker logs ci-cd-test
