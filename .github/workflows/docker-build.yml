
name: Docker Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t ci-cd-demo:test .

      - name: Run Docker container
        run: docker run -d --name ci-cd-test -p 8083:80 ci-cd-demo:test

      - name: Show running containers
        run: docker ps -a

     
      - name: Test application
        run: |
          echo "Waiting for NGINX to start..."

          ready=false

          for attempt in {1..20}; do
            if curl --fail --silent --show-error \
              --max-time 5 \
              --output response.html \
              http://127.0.0.1:8083/; then
              ready=true
              break
            fi

            echo "Attempt $attempt failed. Retrying..."
            sleep 2
          done

          if [ "$ready" != true ]; then
            echo "NGINX did not become ready."
            docker ps -a
            docker logs ci-cd-test
            exit 1
          fi

          echo "NGINX is responding!"
          cat response.html

          grep -Fq "My First CI/CD Deployment!" response.html

          echo "Website test passed!"


      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag ci-cd-demo:test ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}:latest

      - name: Show logs if something fails
        if: failure()
        run: docker logs ci-cd-test
